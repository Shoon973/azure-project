# Daily job: bronze (loaded by Azure Data Factory) -> silver -> gold

resources:
  jobs:
    spotify_azure_job:
      name: spotify_azure_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      tasks:
        - task_key: silver
          notebook_task:
            notebook_path: ../src/silver/silver_dimension.py
        - task_key: gold_dimensions
          depends_on:
            - task_key: silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.spotify_azure_etl.id}
        - task_key: gold_fact
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ../src/jinja/gold_fact_stream.py
