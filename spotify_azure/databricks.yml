# Declarative Automation Bundle for spotify_azure.
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: spotify_azure
  uuid: 95a43e7e-261e-4822-a784-b068dc04163f

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by silver and gold
    default: spotify_catalog

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Set to your workspace URL, or use `databricks configure` / a CLI profile instead.
      host: https://<your-workspace>.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
